#
# withcore Windows package: lwnative lw-engine + CPU audiocpp + transcribe
# (cpu-vulkan) + onnxruntime + FireRedVAD assets. Models are NOT bundled.
# CUDA R2T2 is optional and skipped unless CUDA toolkit is present.

name: Command-Cube withcore

on:
  push:
    branches:
      - Command-Cube
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-withcore:
    name: Windows withcore (CPU native)
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      # Prefer native; engine falls back to mock if libs fail to load.
      LW_ENGINE_GO_BACKEND: native
      LW_ENGINE_NATIVE: "1"
      VERIFY_WITHCORE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # audio.cpp clone needs git history only for build script's own clone

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
          rustc --version
          cargo --version

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/**/incremental/**
          key: command-cube-withcore-${{ runner.os }}-1.93.0-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            command-cube-withcore-${{ runner.os }}-1.93.0-

      - name: Cache R2T2 source / build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/r2t2
          key: r2t2-cpu-${{ hashFiles('scripts/build_r2t2_runtime.py', 'scripts/patches/audio-cpp-r2t2-windows-streaming.patch') }}

      - name: Install NSIS + MinGW (CGO) + CMake
        run: |
          choco install nsis mingw cmake -y --no-progress
          gcc --version
          cmake --version

      - name: Fetch onnxruntime + transcribe CPU (no models)
        run: python scripts/fetch_native_deps_windows.py

      - name: Build R2T2 CPU runtime (audiocpp.dll)
        run: python scripts/build_r2t2_runtime.py --backend cpu

      - name: Build lwnative lw-engine.exe
        shell: bash
        run: |
          export PATH="/c/ProgramData/mingw64/mingw64/bin:/c/ProgramData/chocolatey/bin:$PATH"
          # chocolatey mingw often lands here:
          export PATH="/c/ProgramData/mingw64/bin:/c/tools/mingw64/bin:$PATH"
          which gcc || true
          LW_ENGINE_NATIVE=1 ./scripts/build_lw_engine_for_bundle.sh windows

      - name: Stage withcore tauri resources
        run: python scripts/stage_withcore_tauri_resources.py withcore

      - name: Verify withcore bundle
        run: node scripts/verify_lw_engine_bundle.mjs

      - name: Verify Windows native layout
        run: python scripts/verify_windows_native_layout.py

      - name: Upload native runtime bits
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-cube-withcore-native-libs
          path: |
            src-tauri/resources/lw-engine.exe
            src-tauri/resources/onnxruntime.dll
            src-tauri/resources/onnxruntime/
            src-tauri/resources/transcribe-native/
            src-tauri/resources/r2t2-native/cpu/
            src-tauri/resources/fireredvad_vad.onnx
            src-tauri/resources/fireredvad_cmvn.json
          if-no-files-found: error
          retention-days: 14

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build:distribution

      - name: Build Tauri Windows app (NSIS withcore)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm tauri build

      - name: Collect Tauri bundle outputs
        run: |
          $out = "smoke-upload"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          if ($nsis) { Copy-Item $nsis.FullName -Destination $out; Write-Host "NSIS: $($nsis.Name)" }
          if ($msi) { Copy-Item $msi.FullName -Destination $out; Write-Host "MSI: $($msi.Name)" }
          $main = Get-ChildItem -Path "src-tauri/target/release" -Filter "命令方块.exe" -File -ErrorAction SilentlyContinue
          if (-not $main) {
            $main = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          }
          if ($main) {
            Copy-Item $main.FullName -Destination (Join-Path $out "app.exe")
            Write-Host "app: $($main.Name)"
          }
          Get-ChildItem $out | Format-Table Name, Length
          if (-not (Get-ChildItem $out -ErrorAction SilentlyContinue)) {
            throw "No Tauri bundle outputs"
          }

      - name: Upload withcore Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-cube-withcore-windows-app
          path: smoke-upload/
          if-no-files-found: error
          retention-days: 14

      - name: Note CUDA status
        if: always()
        run: |
          Write-Host "CUDA R2T2 not built in this job (CPU-only withcore)."
          Write-Host "Merge CUDA DLLs: scripts/install_cuda_native_libs.ps1 + artifact command-cube-cuda-native"
          Write-Host "Docs: docs/command-cube/CUDA_NATIVE_INSTALL.md and TEST_CHECKLIST.md"
          Write-Host "Models (Qwen3 / R2T2 GGUF): in-app one-click (native HF) — no Python required in Go mode."
