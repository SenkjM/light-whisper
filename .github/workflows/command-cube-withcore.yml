#
# withcore Windows package: lwnative lw-engine + CPU audiocpp + CUDA audiocpp
# (stripped, PLAN §5 on-demand cudart/cublas) + CUDA transcribe (ggml-cuda;
# still includes vulkan/cpu backends) + onnxruntime + FireRedVAD assets.
# Models are NOT bundled. cudart/cublas stay on-demand.
# Separate command-cube-cuda-native merge is optional/redundant for current withcore.

name: Command-Cube withcore

on:
  push:
    branches:
      - Command-Cube
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-withcore:
    name: Windows withcore (CPU + CUDA R2T2 + CUDA transcribe)
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      # Prefer native at spawn time; lw-engine errors (does not silent-mock) if load fails.
      LW_ENGINE_GO_BACKEND: native
      LW_ENGINE_NATIVE: "1"
      VERIFY_WITHCORE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
          rustc --version
          cargo --version

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            !src-tauri/target/**/incremental/**
          key: command-cube-withcore-${{ runner.os }}-1.93.0-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            command-cube-withcore-${{ runner.os }}-1.93.0-

      - name: Cache R2T2 source / CPU + CUDA build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/r2t2
          key: r2t2-cpu-cuda-12.9-${{ hashFiles('scripts/build_r2t2_runtime.py', 'scripts/patches/audio-cpp-r2t2-windows-streaming.patch') }}
          restore-keys: |
            r2t2-cpu-cuda-12.9-
            r2t2-cuda-12.9-
            r2t2-cpu-

      - name: Install NSIS + MinGW (CGO) + CMake
        run: |
          choco install nsis mingw cmake -y --no-progress
          gcc --version
          cmake --version

      - name: Install CUDA Toolkit 12.9
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        id: cuda
        with:
          cuda: "12.9.0"
          method: network
          # cufft required by audio.cpp ggml CUDA backend (CUDA::cufft).
          sub-packages: '["nvcc","visual_studio_integration","cudart","cublas","cublas_dev","cufft","cufft_dev","thrust","cupti","nvml_dev","nvtx","cuda_profiler_api"]'
          use-github-cache: true

      - name: Verify nvcc
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          nvcc --version
          if (-not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
            throw "nvcc missing after toolkit install"
          }

      - name: Fetch onnxruntime + transcribe CUDA (no models)
        run: python scripts/fetch_native_deps_windows.py --transcribe cuda

      - name: Build R2T2 CPU runtime (audiocpp.dll)
        run: python scripts/build_r2t2_runtime.py --backend cpu

      - name: Build R2T2 CUDA runtime (audiocpp.dll)
        run: |
          python scripts/build_r2t2_runtime.py --backend cuda --cuda-root "$env:CUDA_PATH"

      - name: Strip CUDA runtime DLLs from shippable package (PLAN on-demand)
        run: python scripts/strip_cuda_runtime_from_r2t2.py

      - name: Build lwnative lw-engine.exe
        shell: bash
        run: |
          export PATH="/c/ProgramData/mingw64/mingw64/bin:/c/ProgramData/chocolatey/bin:$PATH"
          # chocolatey mingw often lands here:
          export PATH="/c/ProgramData/mingw64/bin:/c/tools/mingw64/bin:$PATH"
          which gcc || true
          LW_ENGINE_NATIVE=1 ./scripts/build_lw_engine_for_bundle.sh windows

      - name: Stage withcore tauri resources
        run: python scripts/stage_withcore_tauri_resources.py withcore

      - name: Verify withcore bundle
        run: node scripts/verify_lw_engine_bundle.mjs

      - name: Verify Windows native layout (require CUDA R2T2 + CUDA transcribe)
        run: python scripts/verify_windows_native_layout.py --require-cuda

      - name: Report native size impact
        run: |
          $cpu = Get-Item "src-tauri/resources/r2t2-native/cpu/audiocpp.dll"
          $cuda = Get-Item "src-tauri/resources/r2t2-native/cuda/audiocpp.dll"
          $cudaDir = Get-ChildItem "src-tauri/resources/r2t2-native/cuda" -File | Measure-Object -Property Length -Sum
          Write-Host ("CPU audiocpp.dll: {0:N1} MB" -f ($cpu.Length / 1MB))
          Write-Host ("CUDA audiocpp.dll: {0:N1} MB (bundled; cudart/cublas stripped)" -f ($cuda.Length / 1MB))
          Write-Host ("r2t2-native/cuda/ total: {0:N1} MB" -f ($cudaDir.Sum / 1MB))
          $bad = Get-ChildItem "src-tauri/resources/r2t2-native/cuda" -Filter "cudart64_*.dll" -ErrorAction SilentlyContinue
          if ($bad) { throw "cudart still present after strip: $($bad.Name)" }
          $manifest = Get-Content "src-tauri/resources/r2t2-native/cuda/runtime-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.cuda_runtime -ne "on_demand") { throw "expected cuda_runtime=on_demand" }
          $variant = (Get-Content "src-tauri/resources/transcribe-native/VARIANT.txt" -Raw).Trim()
          if ($variant -ne "cuda") { throw "expected transcribe VARIANT=cuda, got: $variant" }
          $ggmlCuda = Get-Item "src-tauri/resources/transcribe-native/ggml-cuda.dll"
          $trDir = Get-ChildItem "src-tauri/resources/transcribe-native" -File -Recurse | Measure-Object -Property Length -Sum
          Write-Host ("transcribe VARIANT: {0}" -f $variant)
          Write-Host ("ggml-cuda.dll: {0:N1} MB (bundled; cudart/cublas NOT included)" -f ($ggmlCuda.Length / 1MB))
          Write-Host ("transcribe-native/ total: {0:N1} MB (~+198 MB vs prior cpu-vulkan)" -f ($trDir.Sum / 1MB))
          $trCudart = Get-ChildItem "src-tauri/resources/transcribe-native" -Filter "cudart64_*.dll" -Recurse -ErrorAction SilentlyContinue
          if ($trCudart) { throw "cudart must not ship in transcribe-native: $($trCudart.Name)" }

      - name: Upload native runtime bits
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-cube-withcore-native-libs
          path: |
            src-tauri/resources/lw-engine.exe
            src-tauri/resources/onnxruntime.dll
            src-tauri/resources/onnxruntime/
            src-tauri/resources/transcribe-native/
            src-tauri/resources/r2t2-native/cpu/
            src-tauri/resources/r2t2-native/cuda/
            src-tauri/resources/fireredvad_vad.onnx
            src-tauri/resources/fireredvad_cmvn.json
          if-no-files-found: error
          retention-days: 14

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build:distribution

      - name: Build Tauri Windows app (NSIS withcore)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm tauri build

      - name: Collect Tauri bundle outputs
        run: |
          $out = "smoke-upload"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          if ($nsis) { Copy-Item $nsis.FullName -Destination $out; Write-Host "NSIS: $($nsis.Name)" }
          if ($msi) { Copy-Item $msi.FullName -Destination $out; Write-Host "MSI: $($msi.Name)" }
          $main = Get-ChildItem -Path "src-tauri/target/release" -Filter "命令方块.exe" -File -ErrorAction SilentlyContinue
          if (-not $main) {
            $main = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          }
          if ($main) {
            Copy-Item $main.FullName -Destination (Join-Path $out "app.exe")
            Write-Host "app: $($main.Name)"
          }
          Get-ChildItem $out | Format-Table Name, Length
          if (-not (Get-ChildItem $out -ErrorAction SilentlyContinue)) {
            throw "No Tauri bundle outputs"
          }

      - name: Upload withcore Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-cube-withcore-windows-app
          path: smoke-upload/
          if-no-files-found: error
          retention-days: 14

      - name: Note packaging
        if: always()
        run: |
          Write-Host "withcore bundles CPU + CUDA R2T2 and CUDA Qwen3 transcribe (ggml-cuda)."
          Write-Host "cudart/cublas remain on-demand (PLAN section 5) — not in the NSIS."
          Write-Host "CUDA transcribe still ships ggml-vulkan.dll (device preference vulkan OK)."
          Write-Host "Separate command-cube-cuda-native merge is optional/redundant for current withcore."
          Write-Host "Size tip: ggml-cuda.dll ~205 MB; transcribe-native ~279 MB (+~198 MB vs cpu-vulkan)."
          Write-Host "Models (Qwen3 / R2T2 GGUF): in-app one-click — no Python required in Go mode."
