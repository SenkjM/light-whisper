name: Test installer

# Manual test build for SenkjM/light-whisper. Not an official release.
# workflow_dispatch only: do not build on every push and do not publish latest.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-installer
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Windows test installer
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      PYTHONUTF8: "1"
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CUDA_ROOT: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host "Free space before:"
          Get-PSDrive -Name C | Select-Object Used,Free | Format-List
          $paths = @(
            'C:\Android',
            'C:\Program Files\Android',
            'C:\Program Files (x86)\Android',
            "$env:LOCALAPPDATA\Android"
          )
          Get-ChildItem 'C:\hostedtoolcache\windows' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch '^(Python|node)$' } |
            ForEach-Object { $paths += $_.FullName }
          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) {
              Write-Host "Removing $path"
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          git config --global core.longpaths true
          Write-Host "Free space after:"
          Get-PSDrive -Name C | Select-Object Used,Free | Format-List

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.30

      - name: Set up Rust
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup default 1.93.0
          rustc --version

      - name: Install CMake and 7-Zip if missing
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --yes --no-progress
            $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          }
          cmake --version
          $sevenZip = @(
            'C:\Program Files\7-Zip\7z.exe',
            'C:\Program Files (x86)\7-Zip\7z.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $sevenZip) {
            choco install 7zip --yes --no-progress
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          }
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            throw "7-Zip was not installed"
          }
          "SEVEN_ZIP=$sevenZip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "7-Zip: $sevenZip"

      - name: Install CUDA 12.8 toolkit
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'cuda_12.8.0_windows_network.exe'
          $url = 'https://developer.download.nvidia.com/compute/cuda/12.8.0/network_installers/cuda_12.8.0_windows_network.exe'
          Write-Host "Downloading $url"
          curl.exe -fL --retry 5 --retry-all-errors -o $installer $url
          if (-not (Test-Path -LiteralPath $installer)) { throw "CUDA installer download failed" }
          # Compiler and libraries only. No Display.Driver (no GPU on the runner)
          # and no visual_studio_integration (slow; CMake uses nvcc directly).
          $packages = @(
            'nvcc_12.8',
            'cudart_12.8',
            'cublas_12.8',
            'cublas_dev_12.8',
            'thrust_12.8',
            'nvrtc_12.8',
            'nvrtc_dev_12.8',
            'nvjitlink_12.8',
            'curand_12.8',
            'curand_dev_12.8',
            'cusparse_12.8',
            'cusparse_dev_12.8',
            'cusolver_12.8',
            'cusolver_dev_12.8',
            'cufft_12.8',
            'cufft_dev_12.8'
          )
          Write-Host "Installing CUDA subpackages"
          $proc = Start-Process -FilePath $installer -ArgumentList (@('-s','-n') + $packages) -Wait -PassThru
          Write-Host "CUDA installer exit code: $($proc.ExitCode)"
          # 3010 means success but reboot requested. -n suppresses the reboot.
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
            throw "CUDA installer failed with exit code $($proc.ExitCode)"
          }
          $nvcc = Join-Path $env:CUDA_ROOT 'bin\nvcc.exe'
          $deadline = (Get-Date).AddMinutes(3)
          while (-not (Test-Path -LiteralPath $nvcc) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
          }
          if (-not (Test-Path -LiteralPath $nvcc)) { throw "nvcc missing at $nvcc" }
          & $nvcc -V
          foreach ($pattern in @('cublas64_*.dll','cublasLt64_*.dll','cudart64_*.dll')) {
            $matches = @(Get-ChildItem -Path (Join-Path $env:CUDA_ROOT 'bin') -Filter $pattern)
            if ($matches.Count -ne 1) { throw "Expected one $pattern, found $($matches.Count)" }
            Write-Host "Found $($matches[0].FullName)"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:CUDA_ROOT 'LICENSE'))) {
            throw 'CUDA redistribution license is missing'
          }
          "CUDA_PATH=$env:CUDA_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:CUDA_ROOT 'bin')
          Remove-Item -LiteralPath $installer -Force
          Write-Host "Free space after CUDA install:"
          Get-PSDrive -Name C | Select-Object Used,Free | Format-List

      - name: Install frontend dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv lock --check
          uv sync --frozen

      - name: Build R2T2 CPU runtime
        env:
          # MSVC's default code page rejects UTF-8 Chinese sources (C4819).
          # build_r2t2_runtime.py forwards the process environment into cmake.
          CFLAGS: '/utf-8'
          CXXFLAGS: '/utf-8'
          CL: '/utf-8'
          _CL_: '/utf-8'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          Write-Host "CFLAGS=$env:CFLAGS CXXFLAGS=$env:CXXFLAGS CL=$env:CL"
          uv run --locked python scripts/build_r2t2_runtime.py --backend cpu --parallel 3
          if (Test-Path -LiteralPath 'build/r2t2/cpu') {
            Remove-Item -LiteralPath 'build/r2t2/cpu' -Recurse -Force
          }
          Get-PSDrive -Name C | Select-Object Used,Free | Format-List

      - name: Build R2T2 CUDA runtime
        env:
          CFLAGS: '/utf-8'
          CXXFLAGS: '/utf-8'
          CL: '/utf-8'
          _CL_: '/utf-8'
          # CMake initializes CMAKE_CUDA_FLAGS from CUDAFLAGS on a fresh build dir.
          CUDAFLAGS: '-Xcompiler=/utf-8'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          Write-Host "CFLAGS=$env:CFLAGS CXXFLAGS=$env:CXXFLAGS CL=$env:CL CUDAFLAGS=$env:CUDAFLAGS"
          uv run --locked python scripts/build_r2t2_runtime.py --backend cuda --cuda-root "$env:CUDA_ROOT" --parallel 2
          foreach ($dir in @('build/r2t2/cuda','build/r2t2/source')) {
            if (Test-Path -LiteralPath $dir) {
              Remove-Item -LiteralPath $dir -Recurse -Force
            }
          }
          Get-PSDrive -Name C | Select-Object Used,Free | Format-List

      - name: Build engine archive
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv run --locked python scripts/build_engine.py

      - name: Build NSIS installer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm tauri build

      - name: Publish prerelease
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          # Probes below are expected to fail when the test tag is absent.
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = 'test-gpu-idle-unload'
          $installers = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -lt 1) { throw 'NSIS installer not found' }
          $installer = $installers | Sort-Object Length -Descending | Select-Object -First 1
          Write-Host "Uploading $($installer.Name) ($($installer.Length) bytes)"
          Get-FileHash -Algorithm SHA256 -Path $installer.FullName | Format-List

          gh release view $tag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete existing $tag release" }
          }
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --silent
          if ($LASTEXITCODE -eq 0) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete existing $tag tag" }
          }

          $notes = "Built from feat/gpu-idle-unload.`nGPU idle unload defaults off.`nThis is not an official release."
          gh release create $tag $installer.FullName `
            --repo $env:GITHUB_REPOSITORY `
            --prerelease `
            --target $env:GITHUB_SHA `
            --title 'Test: GPU idle unload' `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create the test release' }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -f make_latest=false -F prerelease=true | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Failed to keep the test release off Latest' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,isPrerelease,isDraft,tagName,name
