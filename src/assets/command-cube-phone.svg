<!-- Original landline / desk-phone mark for 命令方块 (not Lucide). ISC. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="命令方块">
  <circle cx="64" cy="64" r="58" fill="#fecaca"/>
  <!-- body -->
  <rect x="28" y="58" width="72" height="50" rx="10" fill="#e11d48" stroke="#9f1239" stroke-width="2"/>
  <rect x="38" y="68" width="52" height="32" rx="6" fill="#fff1f2"/>
  <!-- keypad -->
  <g fill="#9f1239">
    <circle cx="46" cy="74" r="2.2"/><circle cx="64" cy="74" r="2.2"/><circle cx="82" cy="74" r="2.2"/>
    <circle cx="46" cy="83" r="2.2"/><circle cx="64" cy="83" r="2.2"/><circle cx="82" cy="83" r="2.2"/>
    <circle cx="46" cy="92" r="2.2"/><circle cx="64" cy="92" r="2.2"/><circle cx="82" cy="92" r="2.2"/>
  </g>
  <!-- cradle -->
  <rect x="34" y="48" width="12" height="14" rx="3" fill="#9f1239"/>
  <rect x="82" y="48" width="12" height="14" rx="3" fill="#9f1239"/>
  <!-- handset -->
  <rect x="22" y="36" width="22" height="18" rx="7" fill="#e11d48" stroke="#9f1239" stroke-width="1.5"/>
  <rect x="40" y="40" width="48" height="10" rx="5" fill="#fb7185"/>
  <rect x="84" y="36" width="22" height="18" rx="7" fill="#e11d48" stroke="#9f1239" stroke-width="1.5"/>
  <!-- cord -->
  <path d="M104 54 q6 6 -2 12 q6 6 -2 12 q6 6 0 12" fill="none" stroke="#9f1239" stroke-width="2" stroke-linecap="round"/>
</svg>
